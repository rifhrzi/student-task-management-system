services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: student_api
      POSTGRES_PASSWORD: student_api_local
      POSTGRES_DB: student_tasks
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_api -d student_tasks"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
